<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#3D6AD6"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- 书本/日记图标 -->
  <g transform="translate(256,248)">
    <!-- 书本主体 -->
    <rect x="-100" y="-90" width="200" height="180" rx="16" fill="white" opacity="0.95"/>
    <!-- 书脊 -->
    <line x1="-40" y1="-90" x2="-40" y2="90" stroke="#5B8DEF" stroke-width="4" opacity="0.3"/>
    <!-- 左页横线 -->
    <line x1="-80" y1="-50" x2="-52" y2="-50" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-80" y1="-25" x2="-52" y2="-25" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="-52" y2="0" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-80" y1="25" x2="-60" y2="25" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <!-- 右页横线 -->
    <line x1="-24" y1="-50" x2="78" y2="-50" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-24" y1="-25" x2="78" y2="-25" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-24" y1="0" x2="60" y2="0" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <line x1="-24" y1="25" x2="45" y2="25" stroke="#5B8DEF" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
    <!-- 秋叶装饰 -->
    <g transform="translate(70,-70) rotate(-15)">
      <ellipse cx="0" cy="0" rx="18" ry="10" fill="#F4A940" opacity="0.9"/>
      <line x1="0" y1="8" x2="0" y2="22" stroke="#D4882A" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-8" cy="-2" rx="10" ry="6" fill="#E8943A" opacity="0.7" transform="rotate(-30)"/>
    </g>
  </g>
  <!-- 底部文字 -->
  <text x="256" y="418" text-anchor="middle" fill="white" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="52" font-weight="700" letter-spacing="8">秋记</text>
</svg>